# CI for newr.
#
# Cross-platform checklist (enforced below, not just documented):
# - encoding="utf-8" on every read_text()/open() in the compiler (grep step).
# - CRLF source handling: a CRLF copy of hello.newr must check clean.
# - Case-only module-collision test: Foo.newr vs foo.newr must stay two
#   distinct files. This runs on LINUX ONLY: macOS (APFS) and Windows
#   (NTFS) default filesystems are case-insensitive, so the second file
#   would overwrite the first and the step would be red by design on
#   those runners — not because the compiler is wrong, but because the
#   filesystem cannot represent the case. The compiler rule itself
#   (imports are case-sensitive, SPEC.md SS3.3) is tested in the suite.
# - No Unix-exec-bit assumptions: nothing here relies on a file being
#   executable; the launcher is always invoked via `python newr ...`.
# - A Linux-built .pyz runs on the Windows and macOS runners: the
#   build-zipapp job builds the .pyz once on ubuntu and uploads it as
#   an artifact; the zipapp-diff matrix job downloads that same artifact
#   on every OS and runs the checks through it. (Building a fresh .pyz
#   per runner would not prove cross-OS portability at all.)
#
# Per-target emitter jobs: the Python emitter job (python-emitter)
# landed in M2, the JavaScript emitter job (js-emitter) in M3, each
# with its own job; a failure in one target's job never blocks
# another target's release.

name: CI

on:
  push:
  pull_request:

jobs:
  fmt-check:
    name: fmt --check (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The canonical form is pinned by tests/test_fmt.py; every file
      # in examples/ and conformance/ok/ must already be formatted,
      # except the two pipeline programs listed in that file (the
      # parser desugars `|>` to a call, so fmt cannot keep the
      # pipeline spelling). Those two are checked for idempotency
      # and AST round-trip by the tests, not by this job.
      - name: fmt --check over the corpus
        run: |
          for f in examples/*.newr conformance/ok/*.newr conformance/ok/lib/*.newr; do
            case "$f" in
              conformance/ok/pipeline.newr|conformance/ok/fn_pipeline_chain.newr)
                continue ;;
            esac
            python newr fmt --check "$f" || exit 1
          done

  front-end:
    name: front-end suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Front-end test suite
        run: python -m unittest discover -s tests

      # Cross-platform: every text read_text()/open() must say
      # encoding="utf-8" explicitly (binary-mode opens are exempt —
      # none exist yet). `python` (not `python3`) is the command on
      # all three OSes after setup-python; `python3` is not guaranteed
      # on windows-latest.
      - name: Check encoding="utf-8" on every read_text()/open()
        shell: bash
        run: |
          if grep -rn -E "(read_text|open)\(" compiler/ --include="*.py" | grep -v 'encoding='; then
            echo "::error::read_text()/open() without encoding= found in compiler/ — use encoding=\"utf-8\""
            exit 1
          fi

      # Cross-platform: CRLF sources must check clean.
      - name: CRLF source handling
        shell: bash
        run: |
          python -c "data = open('examples/hello.newr', 'rb').read().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n'); open('hello-crlf.newr', 'wb').write(data)"
          python newr check hello-crlf.newr

      # Cross-platform: two modules differing only by case must stay
      # distinct. Linux only — see the header comment for why macOS
      # and Windows cannot run this step.
      - name: Case-only module-collision test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p casecheck
          printf 'print "upper"\n' > casecheck/Foo.newr
          printf 'print "lower"\n' > casecheck/foo.newr
          python -c "
          import os
          names = os.listdir('casecheck')
          assert 'Foo.newr' in names and 'foo.newr' in names, f'case-only modules collided: {names}'
          print('case-only modules are distinct:', sorted(names))
          "

  v0-conformance:
    name: v0 conformance (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # All four must exit 0.
      - name: Check examples through the newr launcher
        shell: bash
        run: |
          python newr check examples/hello_bot.newr
          python newr check examples/showcase.newr
          python newr check examples/hello.newr
          python newr check examples/shop.newr

  build-zipapp:
    name: build zipapp (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build the zipapp ONCE, from the repo package. The `newr`
      # launcher supplies the __main__.py entry point; the .pyz is
      # invoked the same way as the launcher, via `python newr.pyz ...`.
      # This artifact is what the zipapp-diff matrix job downloads on
      # every OS — a .pyz built on Linux must run unchanged on
      # Windows/macOS.
      - name: Build zipapp
        run: python -m zipapp . -o newr.pyz -p "/usr/bin/env python3"

      - name: Upload zipapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: newr-pyz
          path: newr.pyz

  zipapp-diff:
    name: zipapp behavior-diff (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: build-zipapp
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The SAME .pyz built on ubuntu (build-zipapp job), not a fresh
      # local build — that is the whole point of the cross-OS check.
      - name: Download the ubuntu-built zipapp
        uses: actions/download-artifact@v4
        with:
          name: newr-pyz

      # Same checks as v0-conformance, through the zipapp. Verdicts
      # must match the launcher runs exactly: exit 0 for all four.
      - name: Check examples through the zipapp
        shell: bash
        run: |
          python newr.pyz check examples/hello_bot.newr
          python newr.pyz check examples/showcase.newr
          python newr.pyz check examples/hello.newr
          python newr.pyz check examples/shop.newr

  build-binary:
    name: standalone binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.22.3

      # One build per OS: a binary built on Linux does not run on
      # macOS or Windows, so each runner builds its own with
      # scripts/build-binary.sh.
      - name: Build the binary
        shell: bash
        run: bash scripts/build-binary.sh

      # Smoke test through the binary, not the launcher: version,
      # check, and build all seven targets on the shop example.
      # The runtime files are bundled with --add-data; without them
      # build fails with FileNotFoundError: compiler/newr_rt.py.
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=dist/newr-binary
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/newr-binary.exe; fi
          "$BIN" version
          "$BIN" check examples/hello.newr
          "$BIN" check examples/shop.newr
          for t in py js java cs rs kt dart; do
            "$BIN" build --target "$t" -o "$RUNNER_TEMP/binary-smoke/$t/shop" examples/shop.newr
          done

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: newr-binary-${{ matrix.os }}
          path: dist/newr-binary*

  golden-rebuild:
    name: golden rebuild check (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The v0 golden files must exist and be byte-identical to the v0
      # originals. The hashes below are the v0 originals' SHA-256.
      # Emitter golden comparison (regenerating goldens from the .newr
      # sources and diffing) lands in M2, when the emitters do.
      - name: v0 golden files exist and match the v0 originals
        shell: bash
        run: |
          test -f examples/hello.py
          test -f examples/showcase.py
          python -c "
          import hashlib, sys
          expected = {
              'examples/hello.py': '1eb3265be38e2639a1fe1339d121c5feedfa1ace413749a20e67f7b997543f00',
              'examples/showcase.py': 'a8222f1be0f901ac9994c3978ed92dfeb38b2695830baba098dbc9206bf504d7',
          }
          for path, want in expected.items():
              got = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              if got != want:
                  print(f'{path}: MISMATCH\n  got {got}\n  want {want}')
                  sys.exit(1)
              print(f'{path}: matches v0 original')
          "

  # M2: the Python emitter job. One job per target (the JS emitter
  # lands in M3 with its own job); a failure here never blocks the
  # front-end jobs, and vice versa.
  python-emitter:
    name: python emitter (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # discord.py + aiosqlite are needed for the bot emitter
      # round-trip tests (tests/test_emitter_bot.py) and the shop
      # economy benchmark driver. The pin matches the M2 research.
      - name: Install discord.py + aiosqlite
        run: python -m pip install "discord.py==2.7.1" aiosqlite

      - name: Full test suite (incl. emitter, goldens, conformance)
        run: python -m unittest discover -s tests

      # The conformance harness builds every ok program, runs the
      # emitted Python, and requires a PASS verdict from each.
      - name: Conformance corpus
        run: python conformance/run.py

      # Build every example and run the emitted Python. The bots
      # (hello_bot, showcase, shop) stop at the DISCORD_TOKEN guard
      # when no token is set: exit 1 with the token message — that
      # is the expected behaviour here, and it proves the emitted
      # bot got far enough to run its main().
      - name: Build + run the examples
        shell: bash
        run: |
          python newr build examples/hello.newr -o hello_out.py
          python hello_out.py
          python newr build examples/shop.newr -o shop_out.py
          python -m py_compile shop_out.py shop_items.py
          if python shop_out.py 2>&1 | grep -q DISCORD_TOKEN; then
            echo "shop: token guard reached (expected, no token set)"
          else
            echo "::error::shop did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build examples/hello_bot.newr -o hello_bot_out.py
          if python hello_bot_out.py 2>&1 | grep -q DISCORD_TOKEN; then
            echo "hello_bot: token guard reached (expected, no token set)"
          else
            echo "::error::hello_bot did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build examples/showcase.newr -o showcase_out.py
          if python showcase_out.py 2>&1 | grep -q DISCORD_TOKEN; then
            echo "showcase: token guard reached (expected, no token set)"
          else
            echo "::error::showcase did not reach the DISCORD_TOKEN guard"
            exit 1
          fi

      # The M2 goldens must match what the emitter produces right
      # now (compare-only; regeneration needs --bless, never by hand).
      - name: Golden comparison
        run: python -m unittest tests.test_goldens -v

  # M3: the JavaScript emitter job. One job per target; a failure
  # here never blocks the other targets' jobs, and vice versa.
  # Node 24 is the floor (node:sqlite is built in from 24; J9/J10).
  # Python is still needed — the compiler itself is Python, and
  # the full suite includes the Python emitter tests too.
  js-emitter:
    name: js emitter (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # discord.py + aiosqlite are needed for the Python bot
      # emitter round-trip tests (tests/test_emitter_bot.py) that
      # the full suite includes. The JS bot tests use the in-repo
      # mock discord.js (tests/js/mocks) — no npm install needed
      # for the suite — but the example runs below load the emitted
      # bot against REAL discord.js, so it is installed here.
      - name: Install discord.py + aiosqlite
        run: python -m pip install "discord.py==2.7.1" aiosqlite

      - name: Install discord.js 14.28.1 (for the example runs)
        run: npm install --no-save --prefix "${{ runner.temp }}/djs" discord.js@14.28.1

      - name: Full test suite (incl. JS emitter, goldens, conformance)
        run: python -m unittest discover -s tests

      # The conformance harness builds every ok program with
      # `--target js`, runs the emitted JS under Node, and requires
      # a PASS verdict from each.
      - name: Conformance corpus (JS)
        run: python conformance/run.py --target js

      # Build every example and run the emitted JS. The bots
      # (hello_bot, showcase, shop) stop at the DISCORD_TOKEN guard
      # when no token is set: exit 1 with the token message — that
      # is the expected behaviour here, and it proves the emitted
      # bot got far enough to run its main(). NODE_PATH points at
      # the real discord.js installed above (the emitted bot
      # requires it at load time).
      - name: Build + run the examples (JS)
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/djs/node_modules
        run: |
          python newr build --target js examples/hello.newr -o hello_out.js
          node hello_out.js
          python newr build --target js examples/shop.newr -o shop_out.js
          node --check shop_out.js shop_items.js shop_out_deploy.js newr_rt.js
          if node shop_out.js 2>&1 | grep -q DISCORD_TOKEN; then
            echo "shop: token guard reached (expected, no token set)"
          else
            echo "::error::shop did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target js examples/hello_bot.newr -o hello_bot_out.js
          if node hello_bot_out.js 2>&1 | grep -q DISCORD_TOKEN; then
            echo "hello_bot: token guard reached (expected, no token set)"
          else
            echo "::error::hello_bot did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target js examples/showcase.newr -o showcase_out.js
          if node showcase_out.js 2>&1 | grep -q DISCORD_TOKEN; then
            echo "showcase: token guard reached (expected, no token set)"
          else
            echo "::error::showcase did not reach the DISCORD_TOKEN guard"
            exit 1
          fi

      # The M3 goldens must match what the emitter produces right
      # now (compare-only; regeneration needs --bless, never by hand).
      - name: Golden comparison (JS)
        run: python -m unittest tests.test_goldens.TestGoldensJs -v

  # M4: the Java emitter job. One job per target; a failure here
  # never blocks the other targets' jobs, and vice versa.
  # Java 21 is the floor (Temurin 21 LTS; the emitted code uses no
  # feature newer than Java 17, K1). Python is still needed — the
  # compiler itself is Python, and the full suite includes the
  # Python emitter tests too. JDA + sqlite-jdbc are downloaded from
  # Maven Central (the jars are NOT vendored in the repo).
  java-emitter:
    name: java emitter (${{ matrix.os }}, Java 21)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # discord.py + aiosqlite are needed for the Python bot
      # emitter round-trip tests (tests/test_emitter_bot.py) that
      # the full suite includes.
      - name: Install discord.py + aiosqlite
        run: python -m pip install "discord.py==2.7.1" aiosqlite

      # JDA 6.7.0 + sqlite-jdbc 3.54.1.0, the exact versions the
      # emitter was verified against (javap + Maven Central).
      # slf4j-api + trove4j are JDA runtime dependencies: the
      # emitted bot's COMMANDS initializer runs at class-load time
      # (before main's token check), and JDA's CommandDataImpl
      # needs both to load — without them the run dies with
      # NoClassDefFoundError instead of reaching the token guard.
      - name: Download JDA + sqlite-jdbc + JDA runtime deps
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/jars"
          curl -sSL -o "${{ runner.temp }}/jars/jda.jar" https://repo1.maven.org/maven2/net/dv8tion/JDA/6.7.0/JDA-6.7.0.jar
          curl -sSL -o "${{ runner.temp }}/jars/sqlite-jdbc.jar" https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.54.1.0/sqlite-jdbc-3.54.1.0.jar
          curl -sSL -o "${{ runner.temp }}/jars/slf4j-api.jar" https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.19/slf4j-api-2.0.19.jar
          curl -sSL -o "${{ runner.temp }}/jars/trove4j.jar" https://repo1.maven.org/maven2/net/sf/trove4j/core/3.1.0/core-3.1.0.jar

      - name: Full test suite (incl. Java emitter, goldens, conformance)
        run: python -m unittest discover -s tests

      # The conformance harness builds every ok program with
      # `--target java`, compiles the emitted Java with javac, runs
      # it, and requires a PASS verdict from each.
      - name: Conformance corpus (Java)
        run: python conformance/run.py --target java

      # Build every example, compile the emitted Java, and run it.
      # The bots (hello_bot, showcase, shop) stop at the
      # DISCORD_TOKEN guard when no token is set: exit 1 with the
      # token message — that is the expected behaviour here, and it
      # proves the emitted bot got far enough to run its main().
      - name: Build + run the examples (Java)
        shell: bash
        env:
          JARS: ${{ runner.temp }}/jars/jda.jar:${{ runner.temp }}/jars/sqlite-jdbc.jar:${{ runner.temp }}/jars/slf4j-api.jar:${{ runner.temp }}/jars/trove4j.jar
        run: |
          python newr build --target java examples/hello.newr -o hello_out.java
          javac hello_out.java && java hello_out
          python newr build --target java examples/shop.newr -o shop_out.java
          javac -cp "$JARS" shop_out.java shop_items.java shop_out_deploy.java NewrRt.java
          if java -cp ".:$JARS" shop_out 2>&1 | grep -q DISCORD_TOKEN; then
            echo "shop: token guard reached (expected, no token set)"
          else
            echo "::error::shop did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target java examples/hello_bot.newr -o hello_bot_out.java
          javac -cp "$JARS" hello_bot_out.java hello_bot_out_deploy.java
          if java -cp ".:$JARS" hello_bot_out 2>&1 | grep -q DISCORD_TOKEN; then
            echo "hello_bot: token guard reached (expected, no token set)"
          else
            echo "::error::hello_bot did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target java examples/showcase.newr -o showcase_out.java
          javac -cp "$JARS" showcase_out.java showcase_out_deploy.java
          if java -cp ".:$JARS" showcase_out 2>&1 | grep -q DISCORD_TOKEN; then
            echo "showcase: token guard reached (expected, no token set)"
          else
            echo "::error::showcase did not reach the DISCORD_TOKEN guard"
            exit 1
          fi

      # The M4 goldens must match what the emitter produces right
      # now (compare-only; regeneration needs --bless, never by hand).
      - name: Golden comparison (Java)
        run: python -m unittest tests.test_goldens.TestGoldensJava -v

  # M4: the C# emitter job. One job per target; a failure here
  # never blocks the other targets' jobs, and vice versa.
  # .NET 8 is the floor (LTS; the emitted code uses no feature newer
  # than C# 12). Python is still needed — the compiler itself is
  # Python, and the full suite includes the Python emitter tests
  # too. Discord.Net + Microsoft.Data.Sqlite come from NuGet at
  # restore time (the packages are NOT vendored in the repo).
  cs-emitter:
    name: cs emitter (${{ matrix.os }}, .NET 8)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # discord.py + aiosqlite are needed for the Python bot
      # emitter round-trip tests (tests/test_emitter_bot.py) that
      # the full suite includes.
      - name: Install discord.py + aiosqlite
        run: python -m pip install "discord.py==2.7.1" aiosqlite

      - name: Full test suite (incl. C# emitter, goldens, conformance)
        run: python -m unittest discover -s tests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"

      # The conformance harness builds every ok program with
      # `--target cs`, builds the emitted C# with dotnet, runs it,
      # and requires a PASS verdict from each.
      - name: Conformance corpus (C#)
        run: python conformance/run.py --target cs
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"

      # Build every example, build the emitted C#, and run it. The
      # bots (hello_bot, showcase, shop) stop at the DISCORD_TOKEN
      # guard when no token is set: exit 1 with the token message —
      # that is the expected behaviour here, and it proves the
      # emitted bot got far enough to run its Main().
      - name: Build + run the examples (C#)
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          python newr build --target cs examples/hello.newr -o hello_out.cs
          dotnet run --project hello_out.csproj
          python newr build --target cs examples/shop.newr -o shop_out.cs
          dotnet build shop_out.csproj
          if dotnet run --project shop_out.csproj --no-build 2>&1 | grep -q DISCORD_TOKEN; then
            echo "shop: token guard reached (expected, no token set)"
          else
            echo "::error::shop did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target cs examples/hello_bot.newr -o hello_bot_out.cs
          dotnet build hello_bot_out.csproj
          if dotnet run --project hello_bot_out.csproj --no-build 2>&1 | grep -q DISCORD_TOKEN; then
            echo "hello_bot: token guard reached (expected, no token set)"
          else
            echo "::error::hello_bot did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target cs examples/showcase.newr -o showcase_out.cs
          dotnet build showcase_out.csproj
          if dotnet run --project showcase_out.csproj --no-build 2>&1 | grep -q DISCORD_TOKEN; then
            echo "showcase: token guard reached (expected, no token set)"
          else
            echo "::error::showcase did not reach the DISCORD_TOKEN guard"
            exit 1
          fi

      # The M4 goldens must match what the emitter produces right
      # now (compare-only; regeneration needs --bless, never by hand).
      - name: Golden comparison (C#)
        run: python -m unittest tests.test_goldens.TestGoldensCs -v

  # M5: the Rust emitter job. One job per target; a failure here
  # never blocks the other targets' jobs, and vice versa.
  # Rust 1.99.1 is the pinned toolchain (the emitter was verified
  # against it); serenity 0.12.5 + poise 0.7.1 + rusqlite 0.32.1
  # come from crates.io at cargo build time. Python is still
  # needed — the compiler itself is Python, and the full suite
  # includes the Python emitter tests too. CARGO_TARGET_DIR is
  # pinned under runner.temp: /tmp is a 512MB tmpfs on the dev VM
  # and cargo target dirs do not fit there. It is set per step,
  # not at job level: the `runner` context is not available in
  # job-level `env` (the runner is assigned only after the job
  # starts), and a job-level `runner.temp` makes the whole
  # workflow file invalid (M9: 30 runs failed with 0 jobs).
  rs-emitter:
    name: rust emitter (${{ matrix.os }}, Rust 1.99.1)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      # discord.py + aiosqlite are needed for the Python bot
      # emitter round-trip tests (tests/test_emitter_bot.py) that
      # the full suite includes.
      - name: Install discord.py + aiosqlite
        run: python -m pip install "discord.py==2.7.1" aiosqlite

      - name: Full test suite (incl. Rust emitter, goldens, conformance)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: python -m unittest discover -s tests

      # The conformance harness builds every ok program with
      # `--target rs`, compiles the emitted Rust with rustc (plain
      # programs) or `cargo run` (bot/store programs), runs it, and
      # requires a PASS verdict from each.
      - name: Conformance corpus (Rust)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: python conformance/run.py --target rs

      # Build every example, compile the emitted Rust, and run it.
      # The bots (hello_bot, showcase, shop) stop at the
      # DISCORD_TOKEN guard when no token is set: exit 1 with the
      # token message — that is the expected behaviour here, and it
      # proves the emitted bot got far enough to run its main().
      # The bot builds run in runner.temp so the repo stays clean.
      - name: Build + run the examples (Rust)
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          python newr build --target rs examples/hello.newr -o hello_out.rs
          rustc hello_out.rs -o hello_out
          ./hello_out
          mkdir -p "${{ runner.temp }}/rs-shop" "${{ runner.temp }}/rs-hello-bot" "${{ runner.temp }}/rs-showcase"
          python newr build --target rs examples/shop.newr -o "${{ runner.temp }}/rs-shop/shop_out.rs"
          if (cd "${{ runner.temp }}/rs-shop" && cargo run --quiet 2>&1 | grep -q DISCORD_TOKEN); then
            echo "shop: token guard reached (expected, no token set)"
          else
            echo "::error::shop did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target rs examples/hello_bot.newr -o "${{ runner.temp }}/rs-hello-bot/hello_bot_out.rs"
          if (cd "${{ runner.temp }}/rs-hello-bot" && cargo run --quiet 2>&1 | grep -q DISCORD_TOKEN); then
            echo "hello_bot: token guard reached (expected, no token set)"
          else
            echo "::error::hello_bot did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target rs examples/showcase.newr -o "${{ runner.temp }}/rs-showcase/showcase_out.rs"
          if (cd "${{ runner.temp }}/rs-showcase" && cargo run --quiet 2>&1 | grep -q DISCORD_TOKEN); then
            echo "showcase: token guard reached (expected, no token set)"
          else
            echo "::error::showcase did not reach the DISCORD_TOKEN guard"
            exit 1
          fi

      # The M5 goldens must match what the emitter produces right
      # now (compare-only; regeneration needs --bless, never by hand).
      - name: Golden comparison (Rust)
        run: python -m unittest tests.test_goldens.TestGoldensRs -v

  # M5: the Kotlin emitter job. One job per target; a failure here
  # never blocks the other targets' jobs, and vice versa.
  # Kotlin 2.2.0 (kotlinc-jvm) is the pinned compiler and Java 21
  # (Temurin) the runtime; Kord 0.18.1 + sqlite-jdbc 3.54.1.0 come
  # from Maven Central at Gradle build time. Python is still
  # needed — the compiler itself is Python, and the full suite
  # includes the Python emitter tests too.
  # NOTE (M5 known gap): the emitted Gradle path has NOT been
  # proven live on the dev VM (Gradle 8.12 daemon handshake fails
  # there); the proven path on the VM is kotlinc + resolved Kord
  # jars on the classpath. This job exercises Gradle on the CI
  # runners — if `gradle run` fails there, fall back to that
  # kotlinc path instead of weakening the guard check.
  kt-emitter:
    name: kotlin emitter (${{ matrix.os }}, Kotlin 2.2.0)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # kotlinc is not on the runners by default: fetch the
      # official 2.2.0 compiler zip from JetBrains.
      - name: Install kotlinc 2.2.0
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/kotlin"
          curl -sSL -o "${{ runner.temp }}/kotlin/kotlin-compiler.zip" https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          unzip -q "${{ runner.temp }}/kotlin/kotlin-compiler.zip" -d "${{ runner.temp }}/kotlin"
          echo "${{ runner.temp }}/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.12"

      # discord.py + aiosqlite are needed for the Python bot
      # emitter round-trip tests (tests/test_emitter_bot.py) that
      # the full suite includes.
      - name: Install discord.py + aiosqlite
        run: python -m pip install "discord.py==2.7.1" aiosqlite

      - name: Full test suite (incl. Kotlin emitter, goldens, conformance)
        run: python -m unittest discover -s tests

      # The conformance harness builds every ok program with
      # `--target kt`, compiles the emitted Kotlin with kotlinc,
      # runs it, and requires a PASS verdict from each.
      - name: Conformance corpus (Kotlin)
        run: python conformance/run.py --target kt

      # Build every example, compile the emitted Kotlin, and run
      # it. The bots (hello_bot, showcase, shop) stop at the
      # DISCORD_TOKEN guard when no token is set: exit 1 with the
      # token message — that is the expected behaviour here, and it
      # proves the emitted bot got far enough to run its main().
      # Plain hello goes through kotlinc directly; the bots go
      # through the emitted Gradle project (`gradle run`). The bot
      # builds run in runner.temp so the repo stays clean.
      - name: Build + run the examples (Kotlin)
        shell: bash
        run: |
          python newr build --target kt examples/hello.newr -o hello_out.kt
          kotlinc hello_out.kt -include-runtime -d hello_out.jar
          java -jar hello_out.jar
          mkdir -p "${{ runner.temp }}/kt-shop" "${{ runner.temp }}/kt-hello-bot" "${{ runner.temp }}/kt-showcase"
          python newr build --target kt examples/shop.newr -o "${{ runner.temp }}/kt-shop/shop_out.kt"
          if (cd "${{ runner.temp }}/kt-shop" && gradle run --quiet 2>&1 | grep -q DISCORD_TOKEN); then
            echo "shop: token guard reached (expected, no token set)"
          else
            echo "::error::shop did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target kt examples/hello_bot.newr -o "${{ runner.temp }}/kt-hello-bot/hello_bot_out.kt"
          if (cd "${{ runner.temp }}/kt-hello-bot" && gradle run --quiet 2>&1 | grep -q DISCORD_TOKEN); then
            echo "hello_bot: token guard reached (expected, no token set)"
          else
            echo "::error::hello_bot did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target kt examples/showcase.newr -o "${{ runner.temp }}/kt-showcase/showcase_out.kt"
          if (cd "${{ runner.temp }}/kt-showcase" && gradle run --quiet 2>&1 | grep -q DISCORD_TOKEN); then
            echo "showcase: token guard reached (expected, no token set)"
          else
            echo "::error::showcase did not reach the DISCORD_TOKEN guard"
            exit 1
          fi

      # The M5 goldens must match what the emitter produces right
      # now (compare-only; regeneration needs --bless, never by hand).
      - name: Golden comparison (Kotlin)
        run: python -m unittest tests.test_goldens.TestGoldensKt -v

  # M5: the Dart emitter job. One job per target; a failure here
  # never blocks the other targets' jobs, and vice versa.
  # Dart 3.13.7 is the pinned SDK (the emitter was verified against
  # it); nyxx 6.9.1 + nyxx_commands 6.1.0 + sqlite3 3.9.0 come from
  # pub.dev at `dart pub get` time. Python is still needed — the
  # compiler itself is Python, and the full suite includes the
  # Python emitter tests too.
  dart-emitter:
    name: dart emitter (${{ matrix.os }}, Dart 3.13.7)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Dart 3.13.7
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.7"

      # discord.py + aiosqlite are needed for the Python bot
      # emitter round-trip tests (tests/test_emitter_bot.py) that
      # the full suite includes.
      - name: Install discord.py + aiosqlite
        run: python -m pip install "discord.py==2.7.1" aiosqlite

      - name: Full test suite (incl. Dart emitter, goldens, conformance)
        run: python -m unittest discover -s tests

      # The conformance harness builds every ok program with
      # `--target dart`, runs the emitted Dart, and requires a PASS
      # verdict from each.
      - name: Conformance corpus (Dart)
        run: python conformance/run.py --target dart

      # Build every example and run it. The bots (hello_bot,
      # showcase, shop) stop at the DISCORD_TOKEN guard when no
      # token is set: exit 1 with the token message — that is the
      # expected behaviour here, and it proves the emitted bot got
      # far enough to run its main(). `dart analyze` is the compile
      # proof for the bot files (Dart's javac equivalent); `dart
      # pub get` resolves the nyxx/sqlite3 deps first. The guard
      # stops before any sqlite3 load, so plain `dart` suffices
      # here (no `dart run` native-asset build is needed).
      - name: Build + run the examples (Dart)
        shell: bash
        run: |
          python newr build --target dart examples/hello.newr -o hello_out.dart
          dart hello_out.dart
          python newr build --target dart examples/shop.newr -o shop_out.dart
          dart pub get
          dart analyze shop_out.dart shop_items.dart shop_out_deploy.dart
          if dart shop_out.dart 2>&1 | grep -q DISCORD_TOKEN; then
            echo "shop: token guard reached (expected, no token set)"
          else
            echo "::error::shop did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target dart examples/hello_bot.newr -o hello_bot_out.dart
          dart analyze hello_bot_out.dart hello_bot_out_deploy.dart
          if dart hello_bot_out.dart 2>&1 | grep -q DISCORD_TOKEN; then
            echo "hello_bot: token guard reached (expected, no token set)"
          else
            echo "::error::hello_bot did not reach the DISCORD_TOKEN guard"
            exit 1
          fi
          python newr build --target dart examples/showcase.newr -o showcase_out.dart
          dart analyze showcase_out.dart showcase_out_deploy.dart
          if dart showcase_out.dart 2>&1 | grep -q DISCORD_TOKEN; then
            echo "showcase: token guard reached (expected, no token set)"
          else
            echo "::error::showcase did not reach the DISCORD_TOKEN guard"
            exit 1
          fi

      # The M5 goldens must match what the emitter produces right
      # now (compare-only; regeneration needs --bless, never by hand).
      - name: Golden comparison (Dart)
        run: python -m unittest tests.test_goldens.TestGoldensDart -v
