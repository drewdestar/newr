<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How newr compiles</title>
  <desc id="arch-desc">A .newr source file passes through a shared front end, lexer, parser, resolver, checker, then one emitter per target language. Python, JavaScript, Java, and C# emitters are done. Rust, Kotlin, and Dart are in progress.</desc>
  <rect width="1200" height="400" fill="#ffffff" stroke="#d0d7de"/>
  <!-- pipeline row -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="48" y="48" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="128" y="76" font-size="17" font-weight="700" fill="#1f2328">Source</text>
    <text x="128" y="98" font-size="13" fill="#57606a">.newr file</text>
    <rect x="236" y="48" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="316" y="76" font-size="17" font-weight="700" fill="#1f2328">Lexer</text>
    <text x="316" y="98" font-size="13" fill="#57606a">tokens</text>
    <rect x="424" y="48" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="504" y="76" font-size="17" font-weight="700" fill="#1f2328">Parser</text>
    <text x="504" y="98" font-size="13" fill="#57606a">AST</text>
    <rect x="612" y="48" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="692" y="76" font-size="17" font-weight="700" fill="#1f2328">Resolver</text>
    <text x="692" y="98" font-size="13" fill="#57606a">names, imports</text>
    <rect x="800" y="48" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="880" y="76" font-size="17" font-weight="700" fill="#1f2328">Checker</text>
    <text x="880" y="98" font-size="13" fill="#57606a">types, errors</text>
    <rect x="988" y="48" width="160" height="64" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
    <text x="1068" y="76" font-size="17" font-weight="700" fill="#1f2328">Emitters</text>
    <text x="1068" y="98" font-size="13" fill="#57606a">one per target</text>
  </g>
  <!-- arrows between pipeline boxes -->
  <g stroke="#57606a" stroke-width="2" fill="#57606a">
    <line x1="208" y1="80" x2="228" y2="80"/><polygon points="228,75 238,80 228,85"/>
    <line x1="396" y1="80" x2="416" y2="80"/><polygon points="416,75 426,80 416,85"/>
    <line x1="584" y1="80" x2="604" y2="80"/><polygon points="604,75 614,80 604,85"/>
    <line x1="772" y1="80" x2="792" y2="80"/><polygon points="792,75 802,80 792,85"/>
    <line x1="960" y1="80" x2="980" y2="80"/><polygon points="980,75 990,80 980,85"/>
  </g>
  <!-- divider -->
  <g stroke="#57606a" stroke-width="2" fill="#57606a">
    <line x1="600" y1="136" x2="600" y2="156"/><polygon points="595,156 600,166 605,156"/>
  </g>
  <text x="600" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#57606a" text-anchor="middle">Emitters write readable code in seven languages</text>
  <!-- target chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="48" y="218" width="150" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="68" cy="240" r="5" fill="#1a7f37"/><text x="82" y="245" font-size="15" font-weight="700" fill="#1f2328">Python</text>
    <text x="82" y="264" font-size="12" fill="#57606a">done</text>
    <rect x="207" y="218" width="150" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="227" cy="240" r="5" fill="#1a7f37"/><text x="241" y="245" font-size="15" font-weight="700" fill="#1f2328">JavaScript</text>
    <text x="241" y="264" font-size="12" fill="#57606a">done</text>
    <rect x="366" y="218" width="150" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="386" cy="240" r="5" fill="#1a7f37"/><text x="400" y="245" font-size="15" font-weight="700" fill="#1f2328">Java</text>
    <text x="400" y="264" font-size="12" fill="#57606a">done</text>
    <rect x="525" y="218" width="150" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="545" cy="240" r="5" fill="#1a7f37"/><text x="559" y="245" font-size="15" font-weight="700" fill="#1f2328">C#</text>
    <text x="559" y="264" font-size="12" fill="#57606a">done</text>
    <rect x="684" y="218" width="150" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="704" cy="240" r="5" fill="#9a6700"/><text x="718" y="245" font-size="15" font-weight="700" fill="#1f2328">Rust</text>
    <text x="718" y="264" font-size="12" fill="#57606a">in progress</text>
    <rect x="843" y="218" width="150" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="863" cy="240" r="5" fill="#9a6700"/><text x="877" y="245" font-size="15" font-weight="700" fill="#1f2328">Kotlin</text>
    <text x="877" y="264" font-size="12" fill="#57606a">in progress</text>
    <rect x="1002" y="218" width="150" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="1022" cy="240" r="5" fill="#9a6700"/><text x="1036" y="245" font-size="15" font-weight="700" fill="#1f2328">Dart</text>
    <text x="1036" y="264" font-size="12" fill="#57606a">in progress</text>
  </g>
  <!-- caption -->
  <text x="600" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#57606a" text-anchor="middle">One shared front end. The discord module plugs into the same checker,</text>
  <text x="600" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#57606a" text-anchor="middle">so bot programs get the same errors as plain programs.</text>
</svg>
